<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFrame</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <div id="stage"></div>

    <div id="ui">
        <div id="clock-widget" class="widget">
            <div id="clock-time">--:--</div>
            <div id="clock-date">&nbsp;</div>
        </div>

        <div id="weather-widget" class="widget">
            <div>
                <div id="weather-temp">--°</div>
                <div id="weather-city">Loading…</div>
            </div>
            <div class="right">
                <img id="weather-icon" alt="" hidden>
                <div id="weather-icon-emoji" hidden></div>
                <div id="weather-desc"></div>
            </div>
        </div>

        <div id="special-wrap" class="hidden">
            <div id="special" class="widget hidden"></div>
        </div>

        <div id="note-widget" class="widget">
            <div id="note-label">Note for you</div>
            <div id="note-text"></div>
            <div id="note-author"></div>
        </div>

        <div id="wiki-widget" class="widget">
            <div id="teleprompter-container">
                <div id="teleprompter-content">Loading article…</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
